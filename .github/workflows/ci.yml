name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y systemd

    - name: Install dependencies
      run: uv sync --frozen --extra dev

    - name: Run Ruff Linting
      run: uv run ruff check .

    - name: Run Ruff Formatting Check
      run: uv run ruff format --check src tests

    - name: Run Type Checking (Mypy)
      run: uv run mypy src

    - name: Run Tests with Coverage Gate
      run: uv run pytest --cov=sensehatsensorstomqtt --cov-fail-under=80 tests/

    - name: Verify systemd service unit
      run: |
        sed 's|/usr/local/bin/sensehatsensorstomqtt|/bin/sh|' systemd/sensehatsensorstomqtt.service > /tmp/test.service
        systemd-analyze verify /tmp/test.service

    - name: Build Package
      run: uv build

    - name: Check Package Metadata (Twine)
      run: uv run --with twine twine check dist/*

    - name: Verify Wheel Contents
      run: |
        python3 -c "
        import glob, sys, zipfile
        wheels = glob.glob('dist/*.whl')
        assert len(wheels) == 1, f'Expected 1 wheel, found {len(wheels)}'
        with zipfile.ZipFile(wheels[0]) as z:
            names = z.namelist()
            for n in names:
                if not (n.startswith('sensehatsensorstomqtt/') or (n.startswith('sensehatsensorstomqtt-') and '.dist-info/' in n)):
                    sys.exit(f'Forbidden file found in wheel: {n}')
        print('Wheel contents verified clean.')
        "

  publish-pypi:
    name: Publish to PyPI
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sensehatsensorstomqtt
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"

      - name: Build Distribution Packages
        run: uv build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
          skip-existing: true
